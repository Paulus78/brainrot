<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three.module.js" } }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #cfc7c2; }
      #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <canvas id="gl" class="clip" data-start="0" data-duration="8" data-track-index="0" width="1080" height="1920"></canvas>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 8);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { createBongo, createBucket } from './assets/bongo/bongo.js';
      import { setupStage } from './assets/bongo/stage.js';
      import { characterTest } from './assets/bongo/charTest.js';

      const canvas = document.getElementById('gl');
      const stage = setupStage(THREE, canvas);
      const bongo = createBongo();
      const bucket = createBucket();
      stage.scene.add(bongo.root);
      stage.scene.add(bucket.root);

      function renderAt(t) {
        characterTest(t, { stage, bongo, bucket });
        stage.renderer.render(stage.scene, stage.camera);
      }
      window.renderAt = renderAt;
      window.addEventListener('hf-seek', (e) => renderAt(e.detail.time));
      const q = new URLSearchParams(location.search);
      renderAt(q.has('t') ? parseFloat(q.get('t')) : (window.__hfThreeTime || 0));
      window.__bongoReady = true;
    </script>
  </body>
</html>
